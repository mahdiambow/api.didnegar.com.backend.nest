# Full stack: API + MySQL + phpMyAdmin (local / self-contained)
#   cp .env.example .env
#   docker compose up -d --build
#
#   API:        http://localhost:${PORT:-3000}
#   MySQL:      localhost:${DB_PORT:-3309}
#   phpMyAdmin: http://localhost:${PHPMYADMIN_PORT:-8080}
#
# Nest on host (MySQL + phpMyAdmin only):
#   docker compose up -d mysql phpmyadmin
#   npm run start:dev   # .env: DB_HOST=localhost DB_PORT=3309
#
# IMPORTANT — server:
#   Never point the API at migration-mysql / didnegar_migration_mysql
#   (didnegar.schema.database MySQL on :3307). That service is schema-only.
#   Never set DB_DATABASE=didnegar_new (legacy dump only as SOURCE_DATABASE).
#   On the server compose, set DB_HOST to the app MySQL (e.g. new-mysql)
#   and DB_DATABASE to the Nest DB (e.g. didnegar).
#
# Server DB setup (inside api — image already has dist/):
#   sudo docker compose exec api npm run migration:run:prod
#   sudo docker compose exec api npm run db:import:legacy:prod -- all
#   sudo docker compose exec api npm run db:seed:super-admin:prod
# Or:
#   sudo docker compose exec api npm run db:setup:prod
# Requires SOURCE_DATABASE in .env (legacy dump DB, e.g. didnegar_new).

services:
  api:
    image: didnegar-api:latest
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      # App MySQL on this compose network — NOT migration-mysql / schema DB
      DB_HOST: ${DOCKER_DB_HOST:-mysql}
      DB_PORT: ${DOCKER_DB_PORT:-3306}
      DB_USERNAME: ${DB_USERNAME:-didnegar}
      DB_PASSWORD: ${DB_PASSWORD:-didnegar}
      DB_DATABASE: ${DB_DATABASE:-didnegar}
      SOURCE_DATABASE: ${SOURCE_DATABASE:-didnegar_new}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      SEED_ON_STARTUP: ${SEED_ON_STARTUP:-false}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-12h}
      SWAGGER_PERSIST_AUTH: ${SWAGGER_PERSIST_AUTH:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    container_name: didnegar-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_DATABASE:-didnegar}
      MYSQL_USER: ${DB_USERNAME:-didnegar}
      MYSQL_PASSWORD: ${DB_PASSWORD:-didnegar}
    ports:
      # Host port for local Nest / clients; container always listens on 3306
      - "${DB_PORT:-3309}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=caching_sha2_password
    healthcheck:
      test:
        [
          'CMD',
          'mysqladmin',
          'ping',
          '-h',
          '127.0.0.1',
          '-uroot',
          '-p${MYSQL_ROOT_PASSWORD:-root}',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      UPLOAD_LIMIT: 256M
    ports:
      - '${PHPMYADMIN_PORT:-8080}:80'
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
