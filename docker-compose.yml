# Local stack:
#   cp .env.example .env
#   docker compose up -d
# MySQL: localhost:${DB_PORT:-3309}  |  phpMyAdmin: http://localhost:8080
# API (optional, built image): http://localhost:${PORT:-3000}
#
# Nest on the host (recommended for dev):
#   docker compose up -d migration-mysql phpmyadmin
#   npm run start:dev
#
# Server DB setup (inside api container — image already has dist/, no nest build):
#   sudo docker compose exec api npm run migration:run:prod
#   sudo docker compose exec api npm run db:import:legacy:prod -- all
#   sudo docker compose exec api npm run db:seed:super-admin:prod
# Or one shot:
#   sudo docker compose exec api npm run db:setup:prod
# Requires SOURCE_DATABASE in .env (legacy dump DB, e.g. didnegar_new).

services:
  api:
    image: didnegar-api:latest
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      # Inside the compose network, use the MySQL service name + internal port
      DB_HOST: migration-mysql
      DB_PORT: 3306
      DB_USERNAME: ${DB_USERNAME:-didnegar}
      DB_PASSWORD: ${DB_PASSWORD:-didnegar}
      DB_DATABASE: ${DB_DATABASE:-didnegar}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      SEED_ON_STARTUP: ${SEED_ON_STARTUP:-false}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-12h}
      SWAGGER_PERSIST_AUTH: ${SWAGGER_PERSIST_AUTH:-false}
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      migration-mysql:
        condition: service_healthy

  migration-mysql:
    image: mysql:8.0
    container_name: migration-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_DATABASE:-didnegar}
      MYSQL_USER: ${DB_USERNAME:-didnegar}
      MYSQL_PASSWORD: ${DB_PASSWORD:-didnegar}
    ports:
      # Host port for local Nest / clients; container always listens on 3306
      - "${DB_PORT:-3309}:3306"
    volumes:
      - migration_mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=caching_sha2_password
    healthcheck:
      test:
        [
          'CMD',
          'mysqladmin',
          'ping',
          '-h',
          '127.0.0.1',
          '-uroot',
          '-p${MYSQL_ROOT_PASSWORD:-root}',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: migration-mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - '${PHPMYADMIN_PORT:-8080}:80'
    depends_on:
      migration-mysql:
        condition: service_healthy

volumes:
  migration_mysql_data:
